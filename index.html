<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>镜头扫描分析台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell"><section class="workspace">
    <div class="panel input-panel">
      <div class="brand-row"><div><p class="eyebrow">Director Shot Scanner</p><h1>镜头扫描分析台</h1></div><button class="icon-button" id="clearBtn" title="清空">×</button></div>
      <div class="tabs" role="tablist"><button class="tab active" data-mode="link">链接</button><button class="tab" data-mode="file">视频</button></div>
      <div class="input-mode active" id="linkMode"><label for="videoUrl">视频链接</label><div class="url-row"><input id="videoUrl" type="text" placeholder="粘贴抖音分享文本、短链或视频直链"><button id="analyzeLinkBtn">扫描</button></div></div>
      <div class="input-mode" id="fileMode"><label for="videoFile">上传视频文件</label><input id="videoFile" type="file" accept="video/*"></div>
      <div class="preview"><video id="videoPreview" controls playsinline preload="metadata"></video><div class="empty-preview" id="emptyPreview"><span>等待视频素材</span></div></div>
      <div class="scan-progress" id="scanProgress" hidden><div id="progressText">准备扫描</div><progress id="progressBar" value="0" max="100"></progress></div>
      <div class="director-notes"><label for="brief">分析重点</label><textarea id="brief">识别横移、摇镜、推拉、运动强度、景别倾向、光线色调与画面变化。</textarea></div>
    </div>
    <div class="panel result-panel">
      <div class="result-head"><div><p class="eyebrow">Shot Language</p><h2>逐段画面描述</h2></div><div class="actions"><button id="exportBtn">导出</button></div></div>
      <div class="summary-grid"><div><span>扫描镜头</span><strong id="scanCount">0</strong></div><div><span>运动镜头</span><strong id="motionCount">0</strong></div><div><span>画面段落</span><strong id="shotCount">0</strong></div></div>
      <div class="shot-list" id="shotList"></div>
    </div>
  </section></main>
  <script src="app.js"></script>
</body>
</html>
